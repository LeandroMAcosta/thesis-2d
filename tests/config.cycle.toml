# 2D exact-cycle test config.
#
# All particles have |p_x| = |p_y| = p_0 with random ± signs.
# p_0 is calibrated so each component's bounce period
#   T = 2*L*M / p_0 = 2*1*6.646473667973e-27 / 5.249999...e-24
#     ≈ 2.532e-3 s
# divides exactly into N_steps*DT = 10^6 * 4.430982591982e-7
#                                  ≈ 0.4430982591982 s,
# fitting 175 full periods.
#
# Therefore at t = N_steps*DT, every particle returns EXACTLY to its
# starting (x, y, p_x, p_y) up to FP round-off in the event-time
# accumulation. The check_periodicity.py --mode=cycle script verifies
# this for hx, hy, gpx, gpy and h_xy (a few particles may slip into
# adjacent bins; tolerance is set to 3× the empirical worst case).
#
# 65 536 particles is small enough for the test to run in seconds.

n_part    = 65536
bins      = 500
dt        = 4.430982591982e-7
mass      = 6.646473667973e-27
n_threads = 8
sigma_l   = 0.0

steps = [1000000]

resume      = false
input_file  = "graba.dmp"
dump        = false
output_file = "graba.dmp"

alfa = 0.0
pmin = 2.0e-26
pmax = 3.0e-23

# Cycle init: all particles with |p_x| = |p_y| = uniform_p_magnitude.
init_uniform_p_magnitude = true
uniform_p_magnitude      = 5.2499998262236456e-24   # 175 periods exact
