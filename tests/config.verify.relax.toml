# Relaxation postconditions config.
# 262144 particles, 1M steps total in 10 batches.
# Should converge to chi² ≈ 1 in all marginals, isotropy ≈ 1, correlation ≈ 0.

n_part    = 262144
bins      = 500
dt        = 4.430982591982e-7
mass      = 6.646473667973e-27
n_threads = 8
sigma_l   = 1.0e-4

steps = [100000, 100000, 100000, 100000, 100000,
         100000, 100000, 100000, 100000, 100000]

resume      = false
input_file  = "graba.dmp"
dump        = false
output_file = "graba.dmp"

alfa = 1.0e-4
pmin = 2.0e-26
pmax = 3.0e-23
